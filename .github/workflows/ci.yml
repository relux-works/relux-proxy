name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: swift test
      - name: Build universal app bundle
        env:
          SIGN_IDENTITY: "-"
        run: scripts/build-app.sh
